[project]
name = "insta_highlights_creator"
version = "0.1.0"
description = "Automatically stitches and reframes raw Insta360 X5 footage to create action highlights."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.24.0",
    "ultralytics>=8.1.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
